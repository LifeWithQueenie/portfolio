<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Queen-Esther Obiageli Tawo — Front-End Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b16;--surface:#0e1424;--surface2:#131b30;--text:#eef2ff;--muted:#94a0bd;--line:#1e2842;--a:#7c5cff;--b:#22d3b6;--glow:rgba(124,92,255,.22);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f6fc;--surface:#fff;--surface2:#eef0fa;--text:#12162b;--muted:#59607a;--line:#dde1f0;--a:#5b3df0;--b:#0a9d86;--glow:rgba(91,61,240,.14);color-scheme:light}}
:root[data-theme="light"]{--bg:#f5f6fc;--surface:#fff;--surface2:#eef0fa;--text:#12162b;--muted:#59607a;--line:#dde1f0;--a:#5b3df0;--b:#0a9d86;--glow:rgba(91,61,240,.14);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65;background-image:radial-gradient(circle at 15% 0%,var(--glow),transparent 45%),radial-gradient(circle at 90% 30%,rgba(34,211,182,.08),transparent 40%)}
h1,h2,h3{font-family:Sora,"Plus Jakarta Sans",sans-serif;letter-spacing:-.02em}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
nav{display:flex;justify-content:space-between;align-items:center;padding:24px 0;font-size:14px;font-weight:600}
nav a{color:var(--muted);text-decoration:none;margin-left:24px}nav a:hover{color:var(--text)}
.logo{font-family:Sora,sans-serif;font-weight:800;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:48px;align-items:center;padding:48px 0 72px}
@media(max-width:780px){.hero{grid-template-columns:1fr}.photo{order:-1;max-width:260px}}
.pill{display:inline-block;font-size:13px;font-weight:600;color:var(--b);border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:99px}
h1{font-size:clamp(36px,6vw,62px);line-height:1.04;margin:20px 0 16px;font-weight:800}
h1 span{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);font-size:18px;max-width:540px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.btns{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.btn{padding:13px 24px;border-radius:12px;font-size:15px;font-weight:700;text-decoration:none;border:1px solid var(--line);color:var(--text);background:var(--surface)}
.btn.p{border:0;color:#fff;background:linear-gradient(90deg,var(--a),#9a7dff);box-shadow:0 8px 30px var(--glow)}
.photo{aspect-ratio:1/1.12;border-radius:28px;background:linear-gradient(145deg,var(--a),var(--b));padding:3px;box-shadow:0 20px 60px var(--glow)}
.photo>div{width:100%;height:100%;border-radius:25px;background:var(--surface);overflow:hidden;display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.photo b{font-family:Sora,sans-serif;font-size:72px;font-weight:800;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
section{padding:60px 0}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--b);margin-bottom:8px}
h2{font-size:clamp(26px,4vw,36px);margin:0 0 32px;font-weight:700}
.sk{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.skc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}
.skc h4{margin:0 0 14px;font-family:Sora,sans-serif;font-size:16px}
.skc .chip{background:var(--surface2);margin:0 6px 8px 0;display:inline-block}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:28px}
.proj.big{display:grid;grid-template-columns:1.3fr 1fr}
@media(max-width:820px){.proj.big{grid-template-columns:1fr}}
.shot{background:var(--surface2);padding:22px;display:flex;align-items:center}
.shot img{width:100%;border-radius:12px;border:1px solid var(--line);display:block;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.info{padding:30px}
.info h3{margin:10px 0 6px;font-size:24px}
.info p{color:var(--muted);margin:10px 0 16px}
.info ul{color:var(--muted);padding-left:18px;margin:0 0 18px}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:8px;background:var(--surface2);color:var(--text);margin:0 6px 6px 0}
.st{display:inline-block;font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px}
.st.case{background:rgba(124,92,255,.16);color:var(--a)}
.st.soon{background:rgba(34,211,182,.14);color:var(--b)}
.info a{color:var(--a);font-weight:700;text-decoration:none}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}
.g3 .proj{margin:0}
.mock{height:200px;background:var(--surface2);padding:18px}
.frame{height:100%;border-radius:12px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar{height:20px;border-bottom:1px solid var(--line);display:flex;gap:5px;align-items:center;padding:0 10px}
.bar i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.cnt{padding:12px}
.sun{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ffcf5c,#ff8a4c);box-shadow:0 0 30px rgba(255,170,70,.5)}
.days{display:flex;gap:6px;margin-top:14px}.days div{flex:1;height:44px;border-radius:8px;background:var(--surface)}
.donut{width:70px;height:70px;border-radius:50%;background:conic-gradient(var(--a) 0 38%,var(--b) 0 65%,#ffb347 0 85%,var(--line) 0);position:relative}
.donut::after{content:"";position:absolute;inset:16px;border-radius:50%;background:var(--bg)}
.bars{display:flex;align-items:flex-end;gap:6px;height:60px;flex:1}.bars i{flex:1;border-radius:4px 4px 0 0;background:linear-gradient(var(--a),var(--b))}
.row{display:flex;gap:14px;align-items:center}
.hb{height:54px;border-radius:10px;background:linear-gradient(90deg,var(--a),var(--b));opacity:.85;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cards div{height:46px;border-radius:8px;background:var(--surface)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
footer{padding:40px 0 56px;color:var(--muted);font-size:14px;border-top:1px solid var(--line);margin-top:20px}
a:focus-visible{outline:2px solid var(--b);outline-offset:3px}
</style>
</head>
